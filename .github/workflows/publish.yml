# Publishes to PyPI via Trusted Publishing (no API token stored in the repo).
#
# One-time setup on https://pypi.org  ->  Your projects -> Publishing:
#   owner: hc-ui, repository: longpath, workflow: publish.yml, environment: pypi
# Then run this workflow manually from the Actions tab whenever a release is ready.
name: Publish to PyPI

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
